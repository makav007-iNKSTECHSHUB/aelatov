    const panelList = document.getElementById("panelList");
    const panelCta = document.getElementById("panelCta");
    const backBtn = document.getElementById("backBtn");

    function renderHub() {
      panelView.classList.remove("active");
      hubView.classList.remove("hidden");
      document.querySelectorAll(".nav button").forEach((b) => b.classList.remove("active"));
    }

    function renderSection(key) {
      const data = SECTIONS[key];
      if (!data) {
        renderHub();
        return;
      }
      panelTag.textContent = data.tag;
      panelTitle.textContent = data.title;
      panelDesc.textContent = data.desc;
      panelList.innerHTML = data.items.map((txt) => `<li>${txt}</li>`).join("");
      panelCta.textContent = data.ctaLabel;
      panelCta.href = data.ctaHref;
      if (data.external) {
        panelCta.setAttribute("target", "_blank");
        panelCta.setAttribute("rel", "noopener");
      } else {
        panelCta.removeAttribute("target");
        panelCta.removeAttribute("rel");
      }

      hubView.classList.add("hidden");
      panelView.classList.add("active");
      document.querySelectorAll(".nav button").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-open") === key);
      });
    }

    function openSection(key, push = true) {
      if (!SECTIONS[key]) return;
      if (push) {
        try { history.pushState({ view: key }, "", "#view=" + key); } catch (_) {}
      }
      renderSection(key);
    }

    function showHub() {
      if (history.state && history.state.view) {
        history.back();
      } else {
        renderHub();
      }
    }

    window.addEventListener("popstate", (e) => {
      const viewKey = e.state && e.state.view ? e.state.view : null;
      if (viewKey && SECTIONS[viewKey]) {
        renderSection(viewKey);
